name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with all runtime + dev dependencies (no torch to keep CI fast)
        run: |
          pip install --upgrade pip
          # patch53: galvani 0.5.0 ships only an sdist that fails to build with current
          # setuptools (AttributeError: install_layout); the 0.4.1 wheel works on 3.10-3.13.
          # Pin it here until decision D1 (ROADMAP 0.9) moves galvani to an optional extra.
          pip install "galvani==0.4.1"
          # Real dependency list from pyproject.toml: streamlit, openpyxl, galvani, ... are now
          # installed, so the AppTest and Ivium unit tests run instead of being skipped.
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          # Floor 39 %: measured 40.3 % on 2026-11-12 (patch53); raise it as coverage grows
          # (ROADMAP 1.2: +10 points a month towards the v1.0 target of 70 %).
          pytest tests/ -v --tb=short --cov=eisforge --cov-report=term --cov-report=html --cov-fail-under=39

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
        continue-on-error: true

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Check eisforge package
        run: ruff check eisforge/ --select E,F,W --ignore E501
        continue-on-error: true
