name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core dependencies (no torch to keep CI fast)
        run: |
          pip install --upgrade pip
          pip install numpy scipy pandas matplotlib plotly scikit-learn impedance
          pip install pytest pytest-cov
          # Install package itself without ML extras
          pip install -e . --no-deps

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --ignore=tests/test_ml.py

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
        continue-on-error: true

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Check eisforge package
        run: ruff check eisforge/ --select E,F,W --ignore E501
        continue-on-error: true
