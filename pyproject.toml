[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eisforge"
version = "0.2.0"
description = "EIS data analysis and ML toolkit for electrochemical impedance spectroscopy"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
  { name = "Hoda Jafari" }
]
keywords = [
  "EIS",
  "impedance spectroscopy",
  "electrochemistry",
  "Nyquist plot",
  "Bode plot",
  "machine learning",
  "circuit fitting",
  "literature knowledge base",
  "alcohol oxidation reaction",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "streamlit>=1.30.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "pandas>=2.1.0",
  "matplotlib>=3.8.0",
  "plotly>=5.18.0",
  "galvani>=0.4.0",
  "impedance>=1.4.1",
  "openpyxl>=3.1.0",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
ml = [
  "torch>=2.1.0",
  "scikit-learn>=1.3.0",
  "xgboost>=2.0.0",
  "pyarrow>=14.0.0",
  "transformers>=4.30",
]
dev = [
  "pytest>=7.4.0",
  "pytest-cov",
  "black",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/Hj1308/EISforge"
Issues   = "https://github.com/Hj1308/EISforge/issues"
DOI      = "https://doi.org/10.5281/zenodo.20649692"

[tool.setuptools.packages.find]
where = ["."]
include = ["eisforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E741", "E401", "W291", "W293", "I001"]
