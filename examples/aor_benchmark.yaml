# AOR Literature Benchmark Dataset
# ============================================================
# Alcohol Oxidation Reaction (AOR) catalyst performance data
# compiled from peer-reviewed literature for use as reference
# benchmarks in EISForge validation and comparison workflows.
#
# Potential conversion: E_RHE = E_Ag/AgCl + 0.197 + (0.0592 * pH)
# Compiled by: Hoda Jafari | 2026
# ============================================================

meta:
  description: "AOR benchmark — alkaline alcohol oxidation on Pd/Pt/Ni catalysts"
  sources:
    Ayman2023:
      doi: "10.1155/2023/6674344"
      title: "Efficient Electro-Oxidation of 2-Propanol at Platinum- and Gold-Modified Palladium Nanocatalysts"
      journal: "Journal of Chemistry"
      year: 2023
    Fu2023:
      doi: null
      title: "Pd/DPHE-GS and Pt NW/N-LDG catalysts for methanol oxidation"
      journal: null
      year: 2023
  notes:
    - "Potentials converted from Ag/AgCl (3 M NaCl, E° = 0.197 V) to RHE scale"
    - "pH = 13 assumed for 0.1 M NaOH and 1.0 M KOH electrolytes"
    - "Values marked approximate:true are read from graphical CV traces"
    - "current_normalized_by: geometric unless stated as mass"

entries:

  - entry: 1
    catalyst: "Pd/Au/GC"
    alcohol: "2-propanol"
    electrolyte: "0.1 M NaOH"
    pH: 13
    reference: "Ayman2023"
    potential_data:
      E_onset_V_AgAgCl: -0.6
      E_onset_V_RHE: 0.367
      E_peak_V_AgAgCl: -0.3
      E_peak_V_RHE: 0.667
      reference_scale: "Ag/AgCl/NaCl (3M)"
      approximate: true
    kinetic_data:
      j_at_potential_mA: 0.038
      j_at_potential_V_AgAgCl: -0.4
      j_at_potential_V_RHE: 0.567
      basis: "geometric"
      scan_rate_mV_s: 100.0
    products:
